<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading... | Mor Sofer</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --accent: #7c3aed;
      --text: #ffffff;
      --muted: rgba(255,255,255,0.45);
      --body-width: 680px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.75;
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      text-decoration: none;
      color: var(--text);
    }

    .nav-back {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .nav-back:hover { color: var(--text); }

    /* ── Loading / Error ── */
    .center-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      color: var(--muted);
      gap: 16px;
    }

    .center-state a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }

    /* ── Cover image ── */
    .post-cover {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      display: block;
    }

    /* ── Article ── */
    article {
      max-width: var(--body-width);
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .post-date {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .post-tag {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(124,58,237,0.15);
      color: #a78bfa;
      padding: 3px 10px;
      border-radius: 20px;
    }

    h1.post-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
    }

    .post-excerpt {
      font-size: 18px;
      color: rgba(255,255,255,0.65);
      line-height: 1.6;
      margin-bottom: 48px;
      padding-bottom: 48px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Post content typography ── */
    .post-content h1,
    .post-content h2,
    .post-content h3 {
      font-family: 'Playfair Display', serif;
      margin-top: 2em;
      margin-bottom: 0.6em;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .post-content h1 { font-size: 32px; }
    .post-content h2 { font-size: 26px; }
    .post-content h3 { font-size: 20px; }

    .post-content p { margin-bottom: 1.4em; }

    .post-content a {
      color: #a78bfa;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .post-content ul,
    .post-content ol {
      padding-left: 1.5em;
      margin-bottom: 1.4em;
    }

    .post-content li { margin-bottom: 0.4em; }

    .post-content blockquote {
      border-left: 3px solid var(--accent);
      margin: 2em 0;
      padding: 12px 24px;
      color: rgba(255,255,255,0.7);
      font-style: italic;
      font-size: 18px;
    }

    .post-content code {
      background: rgba(255,255,255,0.07);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .post-content pre {
      background: #111;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      overflow-x: auto;
      margin-bottom: 1.4em;
    }

    .post-content pre code {
      background: none;
      padding: 0;
      font-size: 14px;
    }

    .post-content img {
      width: 100%;
      border-radius: 8px;
      margin: 1.5em 0;
    }

    .post-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 3em 0;
    }

    /* ── Back link at bottom ── */
    .post-footer {
      max-width: var(--body-width);
      margin: 0 auto;
      padding: 0 24px 80px;
      border-top: 1px solid var(--border);
      padding-top: 48px;
    }

    .post-footer a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .post-footer a:hover { color: var(--text); }

    @media (max-width: 600px) {
      nav { padding: 16px 20px; }
      article { padding: 40px 20px 80px; }
      .post-footer { padding: 32px 20px 60px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">Mor Sofer.</a>
  <a href="../index.html#blog" class="nav-back">← All posts</a>
</nav>

<div id="loading" class="center-state">
  <p>Loading post...</p>
</div>

<div id="not-found" class="center-state" style="display:none;">
  <p>Post not found.</p>
  <a href="../index.html#blog">← Back to blog</a>
</div>

<div id="post-content-wrapper" style="display:none;">
  <img id="cover-img" class="post-cover" src="" alt="" style="display:none;" />

  <article>
    <div class="post-meta">
      <span class="post-date" id="post-date"></span>
      <span id="post-tags"></span>
    </div>
    <h1 class="post-title" id="post-title"></h1>
    <p class="post-excerpt" id="post-excerpt" style="display:none;"></p>
    <div class="post-content" id="post-body"></div>
  </article>

  <div class="post-footer">
    <a href="../index.html#blog">← Back to all posts</a>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://jfgoayjdeyfbxlfihqwa.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_jVvidoHImBqOwRhwfMfpMQ_LybvvqjK';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  (async () => {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    if (!slug) {
      show('not-found');
      return;
    }

    const { data: post, error } = await sb
      .from('posts')
      .select('*')
      .eq('slug', slug)
      .eq('status', 'published')
      .single();

    if (error || !post) {
      show('not-found');
      return;
    }

    // Set page title
    document.title = `${post.title} | Mor Sofer`;

    // Cover image
    if (post.cover_image) {
      const img = document.getElementById('cover-img');
      img.src = post.cover_image;
      img.alt = post.title;
      img.style.display = 'block';
    }

    // Date
    if (post.published_at) {
      document.getElementById('post-date').textContent = new Date(post.published_at)
        .toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Tags
    if (post.tags && post.tags.length > 0) {
      document.getElementById('post-tags').innerHTML = post.tags
        .map(t => `<span class="post-tag">${t}</span>`)
        .join(' ');
    }

    // Title & excerpt
    document.getElementById('post-title').textContent = post.title;

    if (post.excerpt) {
      const el = document.getElementById('post-excerpt');
      el.textContent = post.excerpt;
      el.style.display = 'block';
    }

    // Content
    document.getElementById('post-body').innerHTML = post.content || '';

    show('post-content-wrapper');
  })();

  function show(id) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById(id).style.display = id === 'post-content-wrapper' ? 'block' : 'flex';
  }
</script>
</body>
</html>
